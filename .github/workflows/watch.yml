name: 兑换码哨兵

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC（北京 = UTC+8），且会延迟甚至丢弃调度。
    # 实测：配 48 次/天时，一天真正只跑了 4 次左右。所以每个时段多给几轮兜底——
    # 同一时段只会推一次（push_slots 去重），多跑几轮只花分钟数，不会重复推送。
    #
    # 每天 09:00 时段（北京 09:00-20:00）：白天每 30 分钟打一个点。
    # 实测少打点时会被整轮丢弃（11-17 那天的 4 个点全军覆没），
    # 所以改成密集打点，靠 push_slots 去重保证「同一时段只推一次」。
    - cron: "7,37 1-11 * * *"
    # 周三/五/六 晚间时段（北京 22:00-23:00）：UTC 14:07/14:37（22:07/22:37）
    # 前瞻直播的码通常在直播尾声才公布，太早跑会漏；22 点后跑能一次抓齐。
    - cron: "7,37 14 * * 3,5,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取不推送（排查用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: codewatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 随机延迟最多 10 分钟，加上单轮耗时，留足余量
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 随机延迟（避免每次都在同一分钟发起请求）
        # cron 只能配固定分钟，随机性靠入队后 sleep 实现。
        # 白天打点变密后把范围收到 0-2 分钟，控制私有仓库的计费分钟数。
        # 手动触发不延迟，方便调试。改范围就改 % 120（秒）。
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 120))

      - name: 跑一轮监控
        env:
          # 推送通道：优先读仓库变量 NOTIFY_CHANNEL（Settings → Variables）。
          # 都没配、且没有 PUSHPLUS_TOKEN 时退化为 none（只写日志），
          # 否则每轮都会因推送失败而重试、状态永远记不下来。
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || (secrets.PUSHPLUS_TOKEN != '' && 'pushplus' || 'none') }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          BARK_URL: ${{ secrets.BARK_URL }}
          # 可选：填了才能读到「今天签没签、累计几天」
          TAPTAP_COOKIE: ${{ secrets.TAPTAP_COOKIE }}
          # 可选：微博源默认关闭，填了 Cookie 才会启用
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        # pipefail：tee 不能吞掉 run.py 的退出码（推送失败 → 1，配置错误 → 2），
        # 否则 Actions 永远不会变红。
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run --verbose 2>&1 | tee codewatch.log
          else
            python run.py 2>&1 | tee codewatch.log
          fi

      - name: 写入运行摘要
        # 失败时也要写：红色 job 里同样能直接看到卡在哪个源/哪个通道
        if: always()
        run: |
          {
            echo "## 兑换码哨兵运行摘要"
            echo ""
            if [ -f codewatch.log ]; then
              echo '```'
              tail -n 80 codewatch.log
              echo '```'
            else
              echo "本轮没有产生日志（run.py 未启动）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交去重状态
        if: always()
        run: |
          git config user.name  "codewatch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --staged --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: 更新已推送记录 [skip ci]"
            git push
          fi
