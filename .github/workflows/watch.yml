name: 兑换码哨兵

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC（北京 = UTC+8），且会延迟甚至丢弃调度。
    # 实测：配 48 次/天时，一天真正只跑了 4 次左右。所以每个时段多给几轮兜底——
    # 同一时段只会推一次（push_slots 去重），多跑几轮只花分钟数，不会重复推送。
    #
    # 每天 09:00 时段（北京）：UTC 01:07/01:37（09:07/09:37）、04:07/04:37（12:07/12:37）
    - cron: "7,37 1,4 * * *"
    # 周三/五/六 晚间时段（北京 22:00-23:00）：UTC 14:07/14:37（22:07/22:37）
    # 前瞻直播的码通常在直播尾声才公布，太早跑会漏；22 点后跑能一次抓齐。
    - cron: "7,37 14 * * 3,5,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取不推送（排查用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: codewatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 随机延迟最多 10 分钟，加上单轮耗时，留足余量
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 随机延迟（避免每次都在同一分钟发起请求）
        # cron 只能配固定分钟，随机性靠入队后 sleep 实现：0-10 分钟。
        # 手动触发不延迟，方便调试。改范围就改 % 600（秒）。
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 600))

      - name: 跑一轮监控
        env:
          # 推送通道：优先读仓库变量 NOTIFY_CHANNEL（Settings → Variables）。
          # 都没配、且没有 PUSHPLUS_TOKEN 时退化为 none（只写日志），
          # 否则每轮都会因推送失败而重试、状态永远记不下来。
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || (secrets.PUSHPLUS_TOKEN != '' && 'pushplus' || 'none') }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          BARK_URL: ${{ secrets.BARK_URL }}
          # 可选：填了才能读到「今天签没签、累计几天」
          TAPTAP_COOKIE: ${{ secrets.TAPTAP_COOKIE }}
          # 可选：微博源默认关闭，填了 Cookie 才会启用
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run --verbose
          else
            python run.py
          fi

      - name: 提交去重状态
        if: always()
        run: |
          git config user.name  "codewatch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --staged --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: 更新已推送记录 [skip ci]"
            git push
          fi
